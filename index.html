<!DOCTYPE html>
<!--
  Thala Diwali surprise for Amogaa.
  To use your own photos, replace the files in the photos folder, keeping the same names:
    photos/photo1.jpg ... photo5.jpg  -> the five diyas, left to right
    photos/photo6.jpg                 -> the centre of the rangoli
  Square or portrait (4:5) photos fit best. Keep each one around 200-300 KB.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14081F">
<title>For Amogaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #14081F;
    --plum: #2B0F35;
    --gold: #F2C46D;
    --marigold: #F08A24;
    --kumkum: #C4123A;
    --turmeric: #F6D54A;
    --rose: #E0559A;
    --leaf: #2E9E5B;
    --paper: #FFF6E6;
    --serif: "Lora", Georgia, "Times New Roman", serif;
    --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--night); overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--serif);
    color: var(--paper);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* Sky and fireworks */
  #sky {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(90% 55% at 50% 108%, rgba(240,138,36,.22) 0%, rgba(240,138,36,0) 60%),
      radial-gradient(140% 90% at 50% 100%, #3B1442 0%, var(--plum) 40%, var(--night) 80%);
    opacity: 0; transition: opacity 1.6s ease;
  }
  #sky.on { opacity: 1; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  /* Opening */
  #intro {
    position: fixed; inset: 0; z-index: 10; background: #000;
    display: grid; place-items: center; padding: 24px;
    transition: opacity 1.2s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  .intro-line { grid-area: 1 / 1; text-align: center; opacity: 0; color: var(--gold); }
  .intro-line.show { opacity: 1; }
  #line1 {
    font-style: italic; font-weight: 500;
    font-size: clamp(1.3rem, 5.2vw, 2.2rem);
    transition: opacity .8s ease;
  }
  #line2 {
    font-family: var(--script); font-weight: 700; line-height: 1.25;
    font-size: clamp(2rem, 8.5vw, 3.6rem);
    text-shadow: 0 0 18px rgba(242,196,109,.45);
    transition: opacity .6s ease;
  }

  /* Main layout */
  #app {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    opacity: 0; visibility: hidden; transition: opacity 1.4s ease;
  }
  #app.on { opacity: 1; visibility: visible; }
  .row { display: flex; width: 100%; max-width: 640px; margin: 0 auto; padding: 0 10px; }
  #diyaRow { height: clamp(140px, 23vh, 230px); padding-bottom: 4px; }
  #photoRow { height: clamp(104px, 18vh, 180px); padding-bottom: 10px; }
  .col { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; align-items: flex-end; }
  .slot { flex: 1 1 0; min-width: 0; }
  #middle {
    flex: 1 1 auto; min-height: 0; position: relative;
    display: grid; place-items: center;
    container-type: size;
  }

  /* Diyas */
  .diya {
    position: relative; width: min(86%, 96px); aspect-ratio: 1 / 1.05;
    border: 0; background: none; padding: 0; cursor: pointer;
    transform: translateY(var(--arc, 0px)); outline: none;
  }
  .diya:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 12px; }
  .lamp {
    position: absolute; left: 0; bottom: 0; width: 100%; height: auto; display: block;
    transform-origin: 50% 100%;
    filter: brightness(.82); transition: filter 1s ease;
  }
  .diya.lit .lamp { filter: brightness(1.12) drop-shadow(0 -3px 8px rgba(255,160,60,.45)); }
  .diya.nudge .lamp { animation: nudge .5s ease; }
  @keyframes nudge { 0%,100% { transform: none; } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

  .ember {
    position: absolute; left: 50%; bottom: 41.5%; width: 7%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, 50%);
    background: #FF7A1A; box-shadow: 0 0 5px 1px rgba(255,120,30,.5);
    opacity: .3; transition: opacity .4s ease;
  }
  .diya.next .ember { animation: ember 1.6s ease-in-out infinite; }
  .diya.lit .ember { opacity: 0; animation: none; }
  @keyframes ember {
    0%,100% { opacity: .35; box-shadow: 0 0 4px 1px rgba(255,120,30,.5); }
    50% { opacity: 1; box-shadow: 0 0 14px 5px rgba(255,140,40,.85); }
  }

  .glow {
    position: absolute; left: 50%; bottom: 41.5%; width: 260%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, 50%) scale(.2);
    background: radial-gradient(circle, rgba(255,190,90,.48) 0%, rgba(255,140,40,.18) 30%, rgba(255,120,30,0) 62%);
    opacity: 0; pointer-events: none;
    transition: opacity .9s ease, transform .9s ease;
  }
  .diya.lit .glow { opacity: var(--go, 1); transform: translate(-50%, 50%) scale(1); }
  .diya.live .glow { transition: opacity .14s linear, transform .9s ease; }

  .flame-wrap {
    position: absolute; left: 50%; bottom: 41.5%; width: 17%; height: 34%;
    transform: translateX(-50%) scale(0); transform-origin: 50% 100%;
    transition: transform .7s cubic-bezier(.2, 1.6, .4, 1);
  }
  .diya.lit .flame-wrap { transform: translateX(-50%) scale(1); }
  .sway {
    position: absolute; inset: 0; transform-origin: 50% 100%;
    animation: sway var(--sd, 2.8s) ease-in-out infinite;
    animation-delay: var(--dl, 0s);
  }
  .flame {
    position: absolute; inset: 0;
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
    background: radial-gradient(ellipse 60% 75% at 50% 78%,
      #FFFBE6 0%, #FFE27A 22%, #FFB02E 48%, #F2611A 70%, rgba(200,40,10,0) 84%);
    box-shadow: 0 0 10px 2px rgba(255,170,60,.55), 0 0 26px 8px rgba(255,120,30,.25);
    filter: blur(.4px);
    transform-origin: 50% 92%;
    animation: flicker var(--fd, 1s) ease-in-out infinite alternate;
    animation-delay: var(--dl, 0s);
  }
  .core {
    position: absolute; left: 30%; right: 30%; bottom: 6%; height: 34%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 70%, rgba(170,200,255,.85), rgba(255,255,255,.6) 45%, rgba(255,255,255,0) 72%);
  }
  @keyframes flicker {
    0%   { transform: scale(1, 1) skewX(0deg); }
    20%  { transform: scale(.95, 1.08) skewX(-2.5deg); }
    40%  { transform: scale(1.04, .94) skewX(2.5deg); }
    60%  { transform: scale(.96, 1.11) skewX(-1.5deg); }
    80%  { transform: scale(1.02, .96) skewX(1.5deg); }
    100% { transform: scale(.98, 1.05) skewX(-2deg); }
  }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* Photos */
  #photos { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .ph { position: absolute; left: 0; top: 0; opacity: 0; transform-origin: 50% 50%; will-change: transform; }
  .swing { transform-origin: 50% -8%; }
  .ph.swinging .swing { animation: swing var(--sw, 3.8s) ease-in-out infinite; }
  @keyframes swing { 0%,100% { transform: rotate(-2.6deg); } 50% { transform: rotate(2.6deg); } }
  .paper {
    background: var(--paper); padding: 4% 4% 14%; border-radius: 2px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
  }
  .paper img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #3A1B38; }
  #veil {
    position: fixed; inset: 0; z-index: 5; background: rgba(12,4,18,.62);
    opacity: 0; pointer-events: none; transition: opacity .7s ease;
  }
  #veil.on { opacity: 1; pointer-events: auto; }

  /* Hints */
  .hint {
    position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
    font-style: italic; font-size: clamp(.95rem, 3.8vw, 1.15rem); color: var(--gold);
    opacity: 0; transition: opacity .8s ease;
  }
  .hint.show { opacity: .85; }
  #hint { top: 10px; }
  #heartHint { bottom: 4px; }

  /* Rangoli */
  #rangoliWrap {
    grid-area: 1 / 1; position: relative; aspect-ratio: 1;
    width: min(80vw, 46vh); width: min(92cqw, 92cqh);
    opacity: 0; clip-path: inset(0 0 0 0); transition: opacity .4s ease;
  }
  #rangoliWrap.on { opacity: 1; }
  #rangoliWrap.sweep {
    opacity: 0; clip-path: inset(0 0 0 100%); transform: scale(.92) rotate(18deg);
    transition: clip-path 1.5s cubic-bezier(.6,0,.4,1), opacity 1.5s ease, transform 1.5s ease;
  }
  #rangoli { display: block; width: 100%; height: 100%; overflow: visible; }
  .r-line { fill-opacity: 0; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .r-dot { fill: var(--paper); opacity: 0; }
  #heartBtn {
    position: absolute; left: 50%; top: 50%; width: 33%; aspect-ratio: 1; border-radius: 50%;
    border: 3px solid var(--gold); padding: 0; overflow: hidden; background: var(--plum); cursor: pointer;
    transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none;
    box-shadow: 0 0 0 4px rgba(242,196,109,.18), 0 0 26px rgba(255,170,70,.4);
    transition: transform 1.1s cubic-bezier(.2, 1.4, .4, 1), opacity .9s ease;
  }
  #heartBtn.on { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  #heartBtn.pulse { animation: hpulse 2s ease-in-out infinite; }
  #heartBtn.gone { opacity: 0; transition: none; pointer-events: none; animation: none; }
  #heartBtn:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
  #heartBtn img { display: block; width: 100%; height: 100%; object-fit: cover; }
  @keyframes hpulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(242,196,109,.18), 0 0 26px rgba(255,170,70,.4); }
    50% { box-shadow: 0 0 0 12px rgba(242,196,109,.08), 0 0 46px rgba(255,170,70,.75); }
  }

  /* Final message */
  #final {
    grid-area: 1 / 1; width: min(94vw, 580px);
    display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 3cqh, 22px);
    opacity: 0; visibility: hidden; transition: opacity .6s ease;
  }
  #final.on { opacity: 1; visibility: visible; }
  #msg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 10px rgba(242,196,109,.35)); }
  #threadGlow path { fill: none; stroke: #FFB547; stroke-linecap: round; stroke-linejoin: round; }
  #threadGlow .ink { stroke-width: 7; stroke-opacity: .38; }
  #threadGlow .trav { stroke-width: 3; stroke-opacity: .16; }
  #threadCore path { fill: none; stroke: url(#threadGrad); stroke-linecap: round; stroke-linejoin: round; }
  #threadCore .ink { stroke-width: 2.4; }
  #threadCore .trav { stroke-width: 1.1; stroke-opacity: .5; }
  #threadGlow.done { animation: shimmer 3.2s ease-in-out infinite; }
  @keyframes shimmer { 0%,100% { opacity: .75; } 50% { opacity: 1.15; } }
  #countdown { text-align: center; opacity: 0; transform: translateY(10px); transition: opacity 1s ease, transform 1s ease; }
  #countdown.on { opacity: 1; transform: none; }
  .cd-label { font-style: italic; font-size: clamp(.95rem, 4vw, 1.2rem); color: var(--gold); margin-bottom: 6px; }
  .cd { display: flex; justify-content: center; gap: clamp(14px, 5vw, 32px); }
  .cd div { display: flex; flex-direction: column; align-items: center; min-width: 3ch; }
  .cd b { font-weight: 600; font-size: clamp(1.7rem, 8vw, 2.7rem); line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
  .cd small { font-size: clamp(.8rem, 3.2vw, .95rem); color: var(--gold); opacity: .85; font-style: italic; margin-top: 4px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2713A"/><stop offset=".5" stop-color="#A2451D"/><stop offset="1" stop-color="#5E220C"/>
    </linearGradient>
    <radialGradient id="oil" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#7A4514"/><stop offset="1" stop-color="#2A1206"/>
    </radialGradient>
  </defs>
</svg>

<div id="sky"></div>
<canvas id="fx"></canvas>

<div id="intro">
  <p id="line1" class="intro-line">Close your eyes for 5 seconds</p>
  <p id="line2" class="intro-line">Endrum En Enaval – Amogaa</p>
</div>

<main id="app">
  <div id="diyaRow" class="row"></div>

  <div id="middle">
    <p id="hint" class="hint">Tap the glowing diya</p>

    <div id="rangoliWrap">
      <svg id="rangoli" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <button id="heartBtn" type="button" aria-label="Tap our photo">
        <img id="heart" src="photos/photo6.jpg" alt="Us" draggable="false">
      </button>
    </div>

    <div id="final">
      <svg id="msg" viewBox="26 14 548 194" role="img" aria-label="Happy Thala Diwali my dear Pondatiii">
        <defs>
          <linearGradient id="threadGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
            <stop offset="0" stop-color="#FFE7A8"/><stop offset=".35" stop-color="#F2C46D"/>
            <stop offset=".6" stop-color="#FFD9C2"/><stop offset="1" stop-color="#F2B95C"/>
          </linearGradient>
          <filter id="threadBlur" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
          <radialGradient id="sparkGlow">
            <stop offset="0" stop-color="#FFF8E1" stop-opacity="1"/><stop offset=".35" stop-color="#FFC861" stop-opacity=".8"/>
            <stop offset="1" stop-color="#FF8A2A" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g id="threadGlow" filter="url(#threadBlur)"></g>
        <g id="threadCore"></g>
        <g id="spark" opacity="0"><circle r="11" fill="url(#sparkGlow)"/><circle r="2.4" fill="#FFFDF4"/></g>
      </svg>

      <div id="countdown">
        <p id="cdLabel" class="cd-label">Until our first love anniversary</p>
        <div class="cd">
          <div><b id="cdD">0</b><small>days</small></div>
          <div><b id="cdH">00</b><small>hours</small></div>
          <div><b id="cdM">00</b><small>minutes</small></div>
          <div><b id="cdS">00</b><small>seconds</small></div>
        </div>
      </div>
    </div>

    <p id="heartHint" class="hint">Tap the photo</p>
  </div>

  <div id="photoRow" class="row"></div>
</main>

<div id="veil"></div>
<div id="photos"></div>

<script>
(() => {
  'use strict';

  const N = 5;
  // Countdown target: 8 December 2026, midnight on her phone's clock.
  const TARGET = new Date(2026, 11, 8, 0, 0, 0);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = s => document.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const intro = $('#intro'), line1 = $('#line1'), line2 = $('#line2');
  const sky = $('#sky'), app = $('#app');
  const diyaRow = $('#diyaRow'), photoRow = $('#photoRow'), photosLayer = $('#photos'), veil = $('#veil');
  const hint = $('#hint'), heartHint = $('#heartHint');
  const wrap = $('#rangoliWrap'), svg = $('#rangoli'), heartBtn = $('#heartBtn'), heart = $('#heart');
  const finalBox = $('#final'), countdown = $('#countdown');

  // Start loading every photo while the opening plays.
  for (let i = 1; i <= 6; i++) { const im = new Image(); im.src = `photos/photo${i}.jpg`; }

  /* ---------- Build diyas, photo slots and photos ---------- */

  let lampDots = '';
  for (let k = 0; k < 7; k++) {
    const x = 26 + k * 8;
    const u = (x - 50) / 36;
    const y = 31 + 7.5 * (1 - u * u) + 4.5;
    lampDots += `<circle cx="${x}" cy="${y.toFixed(1)}" r="1.5"/>`;
  }
  const LAMP = `<svg class="lamp" viewBox="0 0 100 56" aria-hidden="true">
    <ellipse cx="50" cy="52.5" rx="16" ry="3.2" fill="#3E1607"/>
    <ellipse cx="50" cy="18" rx="46" ry="5.4" fill="url(#oil)" stroke="#E7965A" stroke-width="1.4"/>
    <path d="M4 18 C4 38 26 50 50 50 C74 50 96 38 96 18 C80 25 20 25 4 18 Z" fill="url(#clay)"/>
    <path d="M4 18 C20 25 80 25 96 18" fill="none" stroke="#E7965A" stroke-width="1.4"/>
    <path d="M14 31 C34 41 66 41 86 31" fill="none" stroke="#F6D54A" stroke-width="1.1" opacity=".75"/>
    <g fill="#F2C46D">${lampDots}</g>
    <path d="M50 20 L50 12.5" stroke="#2A1608" stroke-width="2.2" stroke-linecap="round"/>
  </svg>`;

  const ARC = [14, 4, 0, 4, 14];
  const HOLD_TILT = [-6, 4, -3, 5, -4];
  const FINAL_TILT = [-3, 2, -2, 3, -1];
  const REVEAL_TILT = [-2, 1.5, -1.5, 2, -1];
  const diyas = [], slots = [], phs = [];

  for (let i = 0; i < N; i++) {
    const col = document.createElement('div');
    col.className = 'col';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'diya';
    b.setAttribute('aria-label', `Light diya ${i + 1}`);
    b.style.setProperty('--arc', ARC[i] + 'px');
    b.style.setProperty('--fd', rand(.75, 1.15).toFixed(2) + 's');
    b.style.setProperty('--sd', rand(2.2, 3.4).toFixed(2) + 's');
    b.style.setProperty('--dl', (-rand(0, 2)).toFixed(2) + 's');
    b.innerHTML = `<span class="glow"></span>${LAMP}<span class="ember"></span>` +
      `<span class="flame-wrap"><span class="sway"><span class="flame"><span class="core"></span></span></span></span>`;
    b.addEventListener('click', () => light(i));
    col.appendChild(b);
    diyaRow.appendChild(col);
    diyas.push(b);

    const slot = document.createElement('div');
    slot.className = 'slot';
    photoRow.appendChild(slot);
    slots.push(slot);

    const ph = document.createElement('div');
    ph.className = 'ph';
    ph.style.setProperty('--sw', rand(3.2, 4.6).toFixed(2) + 's');
    ph.innerHTML = `<div class="swing"><div class="paper"><img src="photos/photo${i + 1}.jpg" alt="Photo ${i + 1}" draggable="false"></div></div>`;
    photosLayer.appendChild(ph);
    phs.push(ph);
  }
  diyas[0].classList.add('next');

  // The glow around each lit diya breathes irregularly, like real firelight.
  setInterval(() => {
    for (const d of diyas) {
      if (d.classList.contains('live')) {
        d.querySelector('.glow').style.setProperty('--go', (0.72 + Math.random() * 0.28).toFixed(2));
      }
    }
  }, 120);

  /* ---------- Photo positioning ---------- */

  let W = 0, H = 0;
  function sizeBig() {
    W = Math.round(Math.min(innerWidth * 0.74, innerHeight * 0.5, 380));
    phs.forEach(p => { p.style.width = W + 'px'; });
    H = phs[0].offsetHeight || W * 1.33;
  }

  function target(i, st) {
    if (st === 'start') {
      const r = diyas[i].querySelector('.ember').getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2, s: 0.04, r: 0, o: 0 };
    }
    if (st === 'reveal') {
      return { x: innerWidth / 2, y: innerHeight * 0.54, s: 1, r: REVEAL_TILT[i], o: 1 };
    }
    const c = slots[i].getBoundingClientRect();
    const s = Math.min((c.width * 0.84) / W, (c.height - 12) / H);
    if (st === 'hold') {
      const d = diyaRow.getBoundingClientRect();
      return { x: c.left + c.width / 2, y: d.bottom + (s * H) / 2 + 12, s, r: HOLD_TILT[i], o: 1 };
    }
    return { x: c.left + c.width / 2, y: c.top + c.height / 2, s, r: FINAL_TILT[i], o: 1 };
  }

  function apply(i, st, { dur = 0, delay = 0, ease = 'cubic-bezier(.22,.9,.3,1)' } = {}) {
    const p = phs[i], t = target(i, st);
    p.dataset.st = st;
    p.style.transition = dur
      ? `transform ${dur}ms ${ease} ${delay}ms, opacity ${Math.min(dur, 700)}ms ease ${delay}ms`
      : 'none';
    p.style.transform = `translate(${t.x - W / 2}px, ${t.y - H / 2}px) rotate(${t.r}deg) scale(${t.s})`;
    p.style.opacity = t.o;
  }

  addEventListener('resize', () => {
    sizeBig();
    phs.forEach((p, i) => { if (p.dataset.st) apply(i, p.dataset.st); });
    fx.resize();
  });

  /* ---------- Opening ---------- */

  async function begin() {
    // The screen stays fully blank while the fonts load (at most about 1.6 seconds).
    try {
      await Promise.race([
        Promise.all([
          document.fonts.load('italic 500 1em "Lora"'),
          document.fonts.load('600 1em "Lora"'),
          document.fonts.load('700 1em "Dancing Script"')
        ]),
        wait(1600)
      ]);
    } catch (e) { /* fall back to system fonts */ }

    line1.classList.add('show');          // "Close your eyes for 5 seconds", 7 seconds in total
    await wait(6200);
    line1.classList.remove('show');
    await wait(800);
    line2.classList.add('show');          // "Endrum En Enaval – Amogaa", 3 seconds in total
    await wait(2400);
    line2.classList.remove('show');
    await wait(600);

    intro.classList.add('gone');
    sky.classList.add('on');
    app.classList.add('on');

    phs.forEach((p, i) => apply(i, 'start'));

  /* ---------- Diyas and photos ---------- */

  const state = { next: 0, busy: false, phase: 'diyas' };

  function light(i) {
    if (state.phase !== 'diyas' || state.busy) return;
    if (i !== state.next) {
      const d = diyas[state.next];
      d.classList.remove('nudge'); void d.offsetWidth; d.classList.add('nudge');
      return;
    }
    state.busy = true;
    const d = diyas[i];
    d.classList.remove('next');
    d.classList.add('lit');
    setTimeout(() => d.classList.add('live'), 950);
    hint.classList.remove('show');

    reveal(i).then(() => {
      state.next++;
      state.busy = false;
      if (state.next < N) diyas[state.next].classList.add('next');
      else allLit();
    });
  }

  function waitOrTap(ms, minMs) {
    return new Promise(res => {
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        veil.removeEventListener('pointerdown', onTap);
        res();
      };
      const onTap = () => { if (performance.now() - t0 > minMs) finish(); };
      const timer = setTimeout(finish, ms);
      veil.addEventListener('pointerdown', onTap);
    });
  }

  async function reveal(i) {
    apply(i, 'start');
    void phs[i].offsetWidth;
    await wait(380);
    veil.classList.add('on');
    apply(i, 'reveal', { dur: 1100 });
    await waitOrTap(1100 + 2600, 900);   // she can tap to move on a little sooner
    veil.classList.remove('on');
    apply(i, 'hold', { dur: 1000 });
    await wait(950);
  }

  async function allLit() {
    state.phase = 'drift';
    await wait(800);
    const dur = 2600, step = 160;
    for (let i = 0; i < N; i++) {
      apply(i, 'final', { dur, delay: i * step, ease: 'cubic-bezier(.45,.05,.3,1)' });
      setTimeout(() => phs[i].classList.add('swinging'), dur * 0.6 + i * step);
    }
    await wait(dur + (N - 1) * step + 300);
    drawRangoli();
  }

  async function drawRangoli() {
    state.phase = 'rangoli';
    const NS = 'http://www.w3.org/2000/svg';
    const C = 200;
    const DEG = Math.PI / 180;
    const K = reduceMotion ? 0.6 : 0.85;   // overall speed of the drawing
    const lines = [], dots = [];

    const mk = (tag, attrs) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      svg.appendChild(e);
      return e;
    };
    const at = (r, a) => [C + r * Math.cos(a), C + r * Math.sin(a)];
    const petal = (r1, r2, w, a) => {
      const L = r2 - r1, c = Math.cos(a), s = Math.sin(a);
      const P = (x, y) => `${(C + x * c - y * s).toFixed(2)} ${(C + x * s + y * c).toFixed(2)}`;
      return `M${P(r1, 0)} C${P(r1 + L * .35, -w * 1.35)} ${P(r2, -w * .95)} ${P(r2, 0)} ` +
             `C${P(r2, w * .95)} ${P(r1 + L * .35, w * 1.35)} ${P(r1, 0)}Z`;
    };
    const addLine = (d, fill, delay, dur, fillDelay) => {
      const p = mk('path', { d, class: 'r-line', fill: fill || 'none' });
      lines.push({ p, fill: !!fill, delay: delay * K, dur: dur * K, fillDelay: fillDelay * K });
    };
    const addDot = (r, a) => {
      const [x, y] = at(r, a);
      dots.push(mk('circle', { cx: x.toFixed(2), cy: y.toFixed(2), r: 2.6, class: 'r-dot' }));
    };

    // Kolam dots appear first, as guides.
    for (let k = 0; k < 16; k++) addDot(186, (k * 22.5 + 11.25 - 90) * DEG);
    for (let k = 0; k < 8; k++) addDot(140, (k * 45 + 22.5 - 90) * DEG);
    for (let k = 0; k < 16; k++) addDot(80, (k * 22.5 + 11.25 - 90) * DEG);

    // Centre plate, where the photo sits.
    addLine(`M${C - 72} ${C} a72 72 0 1 0 144 0 a72 72 0 1 0 -144 0`, '#2B0F35', 1300, 900, 7000);

    // Eight large petals.
    for (let k = 0; k < 8; k++) {
      const a = (k * 45 - 90) * DEG;
      addLine(petal(82, 150, 24, a), k % 2 ? '#F08A24' : '#C4123A', 2100 + k * 130, 600, 7200 + k * 70);
    }
    // A turmeric vein inside each large petal.
    for (let k = 0; k < 8; k++) {
      const a = (k * 45 - 90) * DEG;
      addLine(petal(94, 138, 10, a), '#F6D54A', 3300 + k * 80, 400, 7700 + k * 50);
    }
    // Eight small petals between them.
    for (let k = 0; k < 8; k++) {
      const a = (k * 45 + 22.5 - 90) * DEG;
      addLine(petal(84, 124, 14, a), '#E0559A', 4000 + k * 100, 450, 8000 + k * 50);
    }
    // Scalloped ring around the flower.
    let wave = '';
    for (let s = 0; s <= 720; s++) {
      const th = (s / 720) * Math.PI * 2;
      const [x, y] = at(158 + 9 * Math.cos(16 * (th + Math.PI / 2)), th);
      wave += (s ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
    }
    addLine(wave + 'Z', null, 4900, 1500, 0);
    // Sixteen outer leaves.
    for (let k = 0; k < 16; k++) {
      const a = (k * 22.5 - 90) * DEG;
      addLine(petal(170, 197, 9, a), k % 2 ? '#F6D54A' : '#2E9E5B', 6200 + k * 50, 400, 8300 + k * 30);
    }

    wrap.classList.add('on');
    for (const L of lines) {
      const len = L.p.getTotalLength();
      L.p.style.strokeDasharray = len;
      L.p.style.strokeDashoffset = len;
    }
    await nextFrame();

    dots.forEach((d, i) => {
      d.style.transition = `opacity .5s ease ${Math.round(i * 35 * K)}ms`;
      d.style.opacity = 1;
    });
    for (const L of lines) {
      L.p.style.transition =
        `stroke-dashoffset ${L.dur}ms ease-in-out ${L.delay}ms, fill-opacity 700ms ease ${L.fillDelay}ms`;
      L.p.style.strokeDashoffset = 0;
      if (L.fill) L.p.style.fillOpacity = 0.92;
    }

    await wait(9600 * K);
    heartBtn.classList.add('on');
    await wait(1100);
    heartBtn.classList.add('pulse');
    heartHint.classList.add('show');
    state.phase = 'heart';
  }

  function writeThread(fromScreen) {
    const NS = 'http://www.w3.org/2000/svg';
    const msg = $('#msg'), glowG = $('#threadGlow'), coreG = $('#threadCore'), spark = $('#spark');
    const DUR = reduceMotion ? 5000 : 8000;

    // Lead-in: the thread starts where the photo burst, loops once, and sweeps round to the first letter.
    const first = THREAD[0].d.slice(1).split(' L')[0].split(' ').map(Number);
    let sx = 300, sy = 250;
    if (fromScreen && msg.getScreenCTM()) {
      const pt = msg.createSVGPoint();
      pt.x = fromScreen.x; pt.y = fromScreen.y;
      const q = pt.matrixTransform(msg.getScreenCTM().inverse());
      sx = q.x; sy = q.y;
    }
    const lead = [];
    const R = 16;
    for (let k = 0; k <= 48; k++) {
      const a = Math.PI / 2 + (k / 48) * Math.PI * 2;
      lead.push([sx + R * Math.cos(a), sy - R + R * Math.sin(a)]);
    }
    const p0 = lead[lead.length - 1];
    const c1 = [Math.min(p0[0], first[0]) - 60, p0[1] + 10];
    const c2 = [first[0] - 70, first[1] + 50];
    for (let k = 1; k <= 40; k++) {
      const t = k / 40, u = 1 - t;
      lead.push([
        u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*first[0],
        u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*first[1]
      ]);
    }
    const all = [{ k: 't', d: 'M' + lead.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') }].concat(THREAD);

    const items = all.map(seg => {
      const cls = seg.k === 'i' ? 'ink' : 'trav';
      const g = document.createElementNS(NS, 'path');
      const c = document.createElementNS(NS, 'path');
      g.setAttribute('d', seg.d); c.setAttribute('d', seg.d);
      g.setAttribute('class', cls); c.setAttribute('class', cls);
      glowG.appendChild(g); coreG.appendChild(c);
      const len = c.getTotalLength();
      for (const el of [g, c]) {
        el.style.strokeDasharray = `${len} ${len}`;
        el.style.strokeDashoffset = len;
      }
      return { g, c, len, speed: seg.k === 'i' ? 1 : 1.8 };
    });
    let total = 0;
    for (const it of items) { it.t0 = total; it.dur = it.len / it.speed; total += it.dur; }

    spark.setAttribute('opacity', '1');
    return new Promise(res => {
      const t0 = performance.now();
      let idx = 0;
      const step = now => {
        const T = Math.min(1, (now - t0) / DUR) * total;
        while (idx < items.length && T >= items[idx].t0 + items[idx].dur) {
          items[idx].g.style.strokeDashoffset = 0;
          items[idx].c.style.strokeDashoffset = 0;
          idx++;
        }
        if (idx < items.length) {
          const it = items[idx];
          const L = it.len * Math.max(0, (T - it.t0) / it.dur);
          it.g.style.strokeDashoffset = it.len - L;
          it.c.style.strokeDashoffset = it.len - L;
          const p = it.c.getPointAtLength(L);
          spark.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
          const ctm = msg.getScreenCTM();
          if (ctm) {
            const sp = msg.createSVGPoint(); sp.x = p.x; sp.y = p.y;
            const q = sp.matrixTransform(ctm);
            fx.sparkle(q.x, q.y);
          }
          requestAnimationFrame(step);
        } else {
          spark.style.transition = 'opacity .8s ease';
          spark.setAttribute('opacity', '0');
          glowG.classList.add('done');
          res();
        }
      };
      requestAnimationFrame(step);
    });
  }

  const cdD = $('#cdD'), cdH = $('#cdH'), cdM = $('#cdM'), cdS = $('#cdS'), cdLabel = $('#cdLabel');
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    let diff = TARGET - Date.now();
    if (diff <= 0) {
      diff = 0;
      cdLabel.textContent = 'Happy first love anniversary';
    }
    const s = Math.floor(diff / 1000);
    cdD.textContent = Math.floor(s / 86400);
    cdH.textContent = pad(Math.floor((s % 86400) / 3600));
    cdM.textContent = pad(Math.floor((s % 3600) / 60));
    cdS.textContent = pad(s % 60);
  }

  async function showFinal(fromScreen) {
    finalBox.classList.add('on');
    await nextFrame();
    await writeThread(fromScreen);
    tick();
    setInterval(tick, 1000);
    countdown.classList.add('on');
  }

  /* ---------- Fireworks ---------- */

  const fx = (() => {
    const cv = $('#fx'), ctx = cv.getContext('2d');
    const COLORS = ['#FFD36B', '#FF9A3C', '#FF4D6D', '#FFE9B0', '#FF6FB5', '#8EE6A8', '#C59BFF', '#7FD8FF', '#FFC94D'];
    let w = 0, h = 0, sk = 1, running = false, show = false, last = 0, nextLaunch = 0;
    let parts = [], rockets = [], pieces = [], flashes = [];
    let shardImg = null;

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      sk = Math.max(0.75, Math.min(1.6, Math.min(w, h) / 480));
    }
    resize();

    function spark(x, y, vx, vy, color, o = {}) {
      if (parts.length > 2400) return;
      parts.push({
        x, y, px: x, py: y, vx, vy, color, life: 1,
        decay: o.decay || rand(.011, .018), drag: o.drag || .955,
        g: o.g === undefined ? .035 : o.g, size: o.size || rand(1.2, 2.2),
        twinkle: !!o.twinkle, crackle: !!o.crackle, cr: false
      });
    }

    function burst(x, y, opt = {}) {
      const scale = opt.scale || 1;
      const type = opt.type || pick(['peony', 'peony', 'ring', 'willow', 'heart', 'peony', 'crackle']);
      const c1 = opt.color || pick(COLORS), c2 = Math.random() < .45 ? pick(COLORS) : c1;
      flashes.push({ x, y, r: 40 * scale * sk, life: 1 });

      if (type === 'heart') {
        const n = Math.round(64 * scale), sp = .23 * sk * scale, col = pick(['#FF4D6D', '#FF6FB5', '#FFD36B']);
        for (let k = 0; k < n; k++) {
          const t = (k / n) * Math.PI * 2;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          spark(x, y, hx * sp, hy * sp, col, { decay: rand(.010, .013), drag: .95, g: .012, size: 2 });
        }
        return;
      }
      if (type === 'ring') {
        const n = Math.round(50 * scale), sp = 3.3 * sk * scale, rot = Math.random() * Math.PI, tilt = rand(.45, 1);
        for (let k = 0; k < n; k++) {
          const a = (k / n) * Math.PI * 2;
          const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp * tilt;
          spark(x, y, vx * Math.cos(rot) - vy * Math.sin(rot), vx * Math.sin(rot) + vy * Math.cos(rot), k % 2 ? c1 : c2, { size: 1.8 });
        }
        return;
      }
      if (type === 'willow') {
        const n = Math.round(80 * scale);
        for (let k = 0; k < n; k++) {
          const a = rand(0, Math.PI * 2), s = rand(.6, 3.2) * sk * scale;
          spark(x, y, Math.cos(a) * s, Math.sin(a) * s, Math.random() < .5 ? '#FFD36B' : '#FFE9B0',
            { decay: rand(.005, .008), drag: .965, g: .022, size: 1.4, twinkle: true });
        }
        return;
      }
      const n = Math.round(76 * scale), crackle = type === 'crackle';
      for (let k = 0; k < n; k++) {
        const a = rand(0, Math.PI * 2), s = 3.9 * sk * scale * (.5 + .5 * Math.random());
        spark(x, y, Math.cos(a) * s, Math.sin(a) * s, k % 2 ? c1 : c2, { crackle });
      }
    }

    function launch() {
      const x = rand(w * .1, w * .9), ty = rand(h * .1, h * .42), y = h + 10, g = .05;
      rockets.push({ x, y, vx: rand(-.6, .6), vy: -Math.sqrt(2 * g * (y - ty)) * 1.04, g });
    }

    function shatter(img, rect) {
      const S = rect.width, R = S / 2, cx = rect.left + R, cy = rect.top + R, n = 8, t = S / n;
      shardImg = img.complete && img.naturalWidth ? img : null;
      let side = 0, sx0 = 0, sy0 = 0;
      if (shardImg) {
        side = Math.min(img.naturalWidth, img.naturalHeight);
        sx0 = (img.naturalWidth - side) / 2;
        sy0 = (img.naturalHeight - side) / 2;
      }
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          const px = rect.left + (i + .5) * t, py = rect.top + (j + .5) * t;
          const dx = px - cx, dy = py - cy;
          if (dx * dx + dy * dy > R * R * 1.05) continue;
          const dist = Math.hypot(dx, dy) || 1;
          pieces.push({
            sx: sx0 + (i * side) / n, sy: sy0 + (j * side) / n, ss: side / n,
            x: px, y: py, size: t,
            vx: (dx / dist) * rand(1, 4) * sk + rand(-.6, .6),
            vy: -rand(7, 12) * Math.sqrt(sk) + (dy / dist) * rand(0, 2),
            rot: 0, vr: rand(-.15, .15), fuse: rand(35, 70)
          });
        }
      }
      flashes.push({ x: cx, y: cy, r: R * 2.4, life: 1 });
      if (!shardImg) {
        for (let k = 0; k < 7; k++) burst(cx + rand(-R, R), cy + rand(-R, R), { scale: .6 });
      }
      ensure();
    }

    function frame(t) {
      if (!last) last = t;
      const dt = Math.min(3, (t - last) / 16.667);
      last = t;

      // Fade what was drawn before, leaving soft trails.
      ctx.globalCompositeOperation = 'destination-out';
      ctx.globalAlpha = 1;
      ctx.fillStyle = `rgba(0,0,0,${Math.min(.5, .2 * dt)})`;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';

      if (show && t >= nextLaunch) {
        launch();
        if (Math.random() < .3) launch();
        nextLaunch = t + rand(650, 1300) * (reduceMotion ? 2.2 : 1);
      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.vy += r.g * dt; r.x += r.vx * dt; r.y += r.vy * dt;
        spark(r.x, r.y, rand(-.3, .3), rand(.5, 1.4), '#FFD9A0', { decay: .05, drag: .9, g: .02, size: 1.2 });
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#FFF3D6';
        ctx.fillRect(r.x - 1.3, r.y - 1.3, 2.6, 2.6);
        if (r.vy >= -.4) { burst(r.x, r.y); rockets.splice(i, 1); }
      }

      let j = 0;
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        p.px = p.x; p.py = p.y;
        const dr = Math.pow(p.drag, dt);
        p.vx *= dr;
        p.vy = p.vy * dr + p.g * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= p.decay * dt;
        if (p.crackle && !p.cr && p.life < .4) {
          p.cr = true;
          for (let k = 0; k < 3; k++) spark(p.x, p.y, rand(-1, 1), rand(-1, 1), '#FFFFFF', { decay: .08, size: 1.4, g: 0 });
        }
        if (p.life <= 0 || p.y > h + 40) continue;
        if (!(p.twinkle && p.life < .5 && Math.random() < .35)) {
          ctx.globalAlpha = Math.min(1, p.life * 1.4);
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.size;
          ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
        parts[j++] = p;
      }
      parts.length = j;

      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i];
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        g.addColorStop(0, `rgba(255,240,200,${.5 * f.life})`);
        g.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
        f.life -= .08 * dt;
        if (f.life <= 0) flashes.splice(i, 1);
      }

      ctx.globalCompositeOperation = 'source-over';
      for (let i = pieces.length - 1; i >= 0; i--) {
        const pc = pieces[i];
        pc.vy += .16 * dt; pc.vx *= .995;
        pc.x += pc.vx * dt; pc.y += pc.vy * dt;
        pc.rot += pc.vr * dt; pc.fuse -= dt;
        if (pc.fuse <= 0) {
          pieces.splice(i, 1);
          ctx.globalCompositeOperation = 'lighter';
          burst(pc.x, pc.y, { scale: rand(.35, .6), type: pick(['peony', 'peony', 'ring', 'heart']) });
          ctx.globalCompositeOperation = 'source-over';
          continue;
        }
        if (shardImg) {
          ctx.save();
          ctx.globalAlpha = 1;
          ctx.translate(pc.x, pc.y);
          ctx.rotate(pc.rot);
          ctx.drawImage(shardImg, pc.sx, pc.sy, pc.ss, pc.ss, -pc.size / 2, -pc.size / 2, pc.size, pc.size);
          ctx.restore();
        }
      }

      requestAnimationFrame(frame);
    }

    function ensure() {
      if (!running) { running = true; requestAnimationFrame(frame); }
    }

    function sparkle(x, y) {
      for (let k = 0; k < 2; k++) {
        spark(x, y, rand(-1.2, 1.2), rand(-1.4, .6), Math.random() < .5 ? '#FFE9B0' : '#FFC94D',
          { decay: rand(.03, .05), drag: .94, g: .04, size: rand(.8, 1.6) });
      }
    }

    return {
      resize,
      shatter,
      sparkle,
      startShow() { show = true; nextLaunch = 0; ensure(); }
    };
  })();

  begin();
})();
</script>
</body>
</html>
