<!DOCTYPE html>
<!--
  Thala Diwali surprise for Amogaa.
  To use your own photos, replace the files in the photos folder, keeping the same names:
    photos/photo1.jpg ... photo5.jpg  -> the five diyas, left to right
    photos/photo6.jpg                 -> the centre of the rangoli
  Any shape works: each frame adjusts to its photo, so nothing is cropped.
  Keep each one around 200-300 KB so it loads quickly on mobile data.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14081F">
<title>For Amogaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,500&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #14081F;
    --plum: #2B0F35;
    --gold: #F2C46D;
    --marigold: #F08A24;
    --kumkum: #C4123A;
    --turmeric: #F6D54A;
    --rose: #E0559A;
    --leaf: #2E9E5B;
    --paper: #FFF6E6;
    --serif: "Lora", Georgia, "Times New Roman", serif;
    --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--night); overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--serif);
    color: var(--paper);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* Sky and fireworks */
  #sky {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(90% 55% at 50% 108%, rgba(240,138,36,.22) 0%, rgba(240,138,36,0) 60%),
      radial-gradient(140% 90% at 50% 100%, #3B1442 0%, var(--plum) 40%, var(--night) 80%);
    opacity: 0; transition: opacity 1.6s ease;
  }
  #sky.on { opacity: 1; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  /* Opening */
  #intro {
    position: fixed; inset: 0; z-index: 10; background: #000;
    display: grid; place-items: center; padding: 24px;
    transition: opacity 1.2s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  .intro-line { grid-area: 1 / 1; text-align: center; opacity: 0; color: var(--gold); }
  .intro-line.show { opacity: 1; }
  #line1 {
    font-style: italic; font-weight: 500;
    font-size: clamp(1.3rem, 5.2vw, 2.2rem);
    transition: opacity .8s ease;
  }
  #line2 {
    font-family: var(--script); font-weight: 700; line-height: 1.25;
    font-size: clamp(2rem, 8.5vw, 3.6rem);
    text-shadow: 0 0 18px rgba(242,196,109,.45);
    transition: opacity .6s ease;
  }

  /* Main layout */
  #app {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    opacity: 0; visibility: hidden; transition: opacity 1.4s ease;
  }
  #app.on { opacity: 1; visibility: visible; }
  .row { display: flex; width: 100%; max-width: 640px; margin: 0 auto; padding: 0 10px; }
  #banner { height: clamp(96px, 15vh, 170px); display: grid; place-items: center; padding: 8px 6px 0; }
  #bannerCanvas { display: block; width: 100%; max-width: 680px; height: 100%; }
  #diyaRow { height: clamp(110px, 17vh, 200px); padding-bottom: 4px; }
  #photoRow { height: clamp(104px, 18vh, 180px); padding-bottom: 10px; }
  .col { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; align-items: flex-end; }
  .slot { flex: 1 1 0; min-width: 0; }
  #middle {
    flex: 1 1 auto; min-height: 0; position: relative;
    display: grid; place-items: center;
    container-type: size;
  }

  /* Diyas */
  .diya {
    position: relative; width: min(86%, 96px); aspect-ratio: 1 / 1.05;
    border: 0; background: none; padding: 0; cursor: pointer;
    transform: translateY(var(--arc, 0px)); outline: none;
  }
  .diya:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 12px; }
  .lamp {
    position: absolute; left: 0; bottom: 0; width: 100%; height: auto; display: block;
    transform-origin: 50% 100%;
    filter: brightness(.82); transition: filter 1s ease;
  }
  .diya.lit .lamp { filter: brightness(1.12) drop-shadow(0 -3px 8px rgba(255,160,60,.45)); }
  .diya.nudge .lamp { animation: nudge .5s ease; }
  @keyframes nudge { 0%,100% { transform: none; } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

  .ember {
    position: absolute; left: 50%; bottom: 41.5%; width: 7%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, 50%);
    background: #FF7A1A; box-shadow: 0 0 5px 1px rgba(255,120,30,.5);
    opacity: .3; transition: opacity .4s ease;
  }
  .ember::after {
    content: ""; position: absolute; inset: -160%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,150,50,.9) 0%, rgba(255,140,40,0) 65%);
    opacity: 0; will-change: opacity, transform;
  }
  .diya.next .ember { animation: ember 1.6s ease-in-out infinite; }
  .diya.next .ember::after { animation: emberHalo 1.6s ease-in-out infinite; }
  .diya.lit .ember { opacity: 0; animation: none; }
  .diya.lit .ember::after { animation: none; opacity: 0; }
  @keyframes ember { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes emberHalo { 0%,100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }

  .glow {
    position: absolute; left: 50%; bottom: 41.5%; width: 260%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, 50%) scale(.2);
    background: radial-gradient(circle, rgba(255,190,90,.48) 0%, rgba(255,140,40,.18) 30%, rgba(255,120,30,0) 62%);
    opacity: 0; pointer-events: none; will-change: opacity, transform;
    transition: opacity .9s ease, transform .9s ease;
  }
  .diya.lit .glow { opacity: var(--go, 1); transform: translate(-50%, 50%) scale(1); }
  .diya.live .glow { transition: opacity .14s linear, transform .9s ease; }

  .flame-wrap {
    position: absolute; left: 50%; bottom: 41.5%; width: 17%; height: 34%;
    transform: translateX(-50%) scale(0); transform-origin: 50% 100%;
    transition: transform .7s cubic-bezier(.2, 1.6, .4, 1);
  }
  .diya.lit .flame-wrap { transform: translateX(-50%) scale(1); }
  .sway {
    position: absolute; inset: 0; transform-origin: 50% 100%;
    animation: sway var(--sd, 2.8s) ease-in-out infinite;
    animation-delay: var(--dl, 0s);
  }
  .flame {
    position: absolute; inset: 0;
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
    background: radial-gradient(ellipse 60% 75% at 50% 78%,
      #FFFBE6 0%, #FFE27A 22%, #FFB02E 48%, #F2611A 70%, rgba(200,40,10,0) 84%);
    box-shadow: 0 0 10px 2px rgba(255,170,60,.55), 0 0 26px 8px rgba(255,120,30,.25);
    filter: blur(.4px);
    transform-origin: 50% 92%;
    animation: flicker var(--fd, 1s) ease-in-out infinite alternate;
    animation-delay: var(--dl, 0s);
  }
  .core {
    position: absolute; left: 30%; right: 30%; bottom: 6%; height: 34%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 70%, rgba(170,200,255,.85), rgba(255,255,255,.6) 45%, rgba(255,255,255,0) 72%);
  }
  @keyframes flicker {
    0%   { transform: scale(1, 1) skewX(0deg); }
    20%  { transform: scale(.95, 1.08) skewX(-2.5deg); }
    40%  { transform: scale(1.04, .94) skewX(2.5deg); }
    60%  { transform: scale(.96, 1.11) skewX(-1.5deg); }
    80%  { transform: scale(1.02, .96) skewX(1.5deg); }
    100% { transform: scale(.98, 1.05) skewX(-2deg); }
  }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* Photos */
  #photos { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .ph { position: absolute; left: 0; top: 0; opacity: 0; transform-origin: 50% 50%; will-change: transform; }
  .swing { transform-origin: 50% -8%; }
  .ph.swinging .swing { animation: swing var(--sw, 3.8s) ease-in-out infinite; }
  @keyframes swing { 0%,100% { transform: rotate(-2.6deg); } 50% { transform: rotate(2.6deg); } }
  .paper {
    background: var(--paper); padding: 4% 4% 14%; border-radius: 2px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
  }
  .paper img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #3A1B38; }
  #veil {
    position: fixed; inset: 0; z-index: 5; background: rgba(12,4,18,.62);
    opacity: 0; pointer-events: none; transition: opacity .7s ease;
  }
  #veil.on { opacity: 1; pointer-events: auto; }

  /* Hints */
  .hint {
    position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
    font-style: italic; font-size: clamp(.95rem, 3.8vw, 1.15rem); color: var(--gold);
    opacity: 0; transition: opacity .8s ease;
  }
  .hint.show { opacity: .85; }
  #hint { top: 10px; }
  #heartHint { bottom: 4px; }

  /* Rangoli */
  #rangoliWrap {
    grid-area: 1 / 1; position: relative; aspect-ratio: 1;
    width: min(80vw, 46vh); width: min(92cqw, 92cqh);
    opacity: 0; transition: opacity .4s ease;
  }
  #rangoliWrap.on { opacity: 1; will-change: transform, opacity; }
  #rangoliWrap.sweep {
    opacity: 0; transform: scale(.6) rotate(40deg);
    transition: opacity 1.3s ease, transform 1.5s cubic-bezier(.6,0,.4,1);
  }
  #rangoli { display: block; width: 100%; height: 100%; overflow: visible; }
  .r-line { fill-opacity: 0; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .r-dot { fill: var(--paper); opacity: 0; }
  #heartBtn {
    position: absolute; left: 50%; top: 50%; width: 27%; aspect-ratio: 1; border-radius: 8px;
    border: 3px solid var(--gold); padding: 0; overflow: visible; background: var(--plum); cursor: pointer;
    transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none;
    box-shadow: 0 0 0 4px rgba(242,196,109,.18), 0 0 26px rgba(255,170,70,.4);
    transition: transform 1.1s cubic-bezier(.2, 1.4, .4, 1), opacity .9s ease;
  }
  #heartBtn.on { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  #heartBtn::after {
    content: ""; position: absolute; inset: -10px; border-radius: 14px; pointer-events: none;
    box-shadow: 0 0 34px 12px rgba(255,170,70,.55), 0 0 0 6px rgba(242,196,109,.12);
    opacity: 0; will-change: opacity, transform;
  }
  #heartBtn.pulse::after { animation: hpulse 2s ease-in-out infinite; }
  #heartBtn.gone::after { display: none; }
  #heartBtn.gone { opacity: 0; transition: none; pointer-events: none; animation: none; }
  #heartBtn:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
  #heartBtn img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
  @keyframes hpulse { 0%,100% { opacity: .3; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }

  /* Final message */
  #final {
    grid-area: 1 / 1; width: min(94vw, 580px);
    display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 3cqh, 22px);
    opacity: 0; visibility: hidden; transition: opacity .6s ease;
  }
  #final.on { opacity: 1; visibility: visible; }
  #msgCanvas { display: block; }
  #msgCanvas.done { animation: shimmer 3.2s ease-in-out infinite; }

  /* Sky lanterns and stars */
  .stars { position: absolute; left: 0; top: 0; width: 2px; height: 2px; border-radius: 50%;
    opacity: .3; will-change: opacity;
    animation: twinkle var(--tw, 4s) ease-in-out infinite; animation-delay: var(--td, 0s); }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .lantern { position: absolute; bottom: -90px; left: var(--x); width: var(--w); opacity: 0;
    will-change: transform, opacity;
    animation: rise var(--dur, 26s) linear infinite; animation-delay: var(--delay, 0s); }
  .lantern-sway { animation: lsway var(--ls, 6s) ease-in-out infinite; transform-origin: 50% 0; }
  .lantern-body { position: relative; aspect-ratio: 3 / 4; border-radius: 42% 42% 34% 34% / 30% 30% 26% 26%;
    background:
      repeating-linear-gradient(90deg, rgba(120,30,10,.0) 0 22%, rgba(120,30,10,.25) 22% 25%),
      radial-gradient(ellipse at 50% 62%, #FFF0B8 0%, #FFC25A 30%, #F07A2A 68%, #A3361A 100%);
    box-shadow: 0 0 16px 5px rgba(255,150,60,.32); }
  .lantern-body::before { content: ""; position: absolute; left: 28%; right: 28%; top: -6%; height: 7%;
    background: #5A1E0C; border-radius: 2px; }
  .lantern-body::after { content: ""; position: absolute; left: 50%; bottom: -16%; width: 2px; height: 16%;
    transform: translateX(-50%); background: linear-gradient(#C9762F, rgba(201,118,47,0)); }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: var(--lo, .85); }
    78% { opacity: var(--lo, .85); }
    100% { transform: translateY(calc(-100vh - 160px)); opacity: 0; }
  }
  @keyframes lsway { 0%,100% { transform: rotate(-4deg) translateX(-6px); } 50% { transform: rotate(4deg) translateX(6px); } }
  @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: .78; } }
  #countdown { text-align: center; opacity: 0; transform: translateY(10px); transition: opacity 1s ease, transform 1s ease; }
  #countdown.on { opacity: 1; transform: none; }
  .cd-label { font-style: italic; font-size: clamp(.95rem, 4vw, 1.2rem); color: #F7A8C4; margin-bottom: 6px; }
  .cd { display: flex; justify-content: center; gap: clamp(14px, 5vw, 32px); }
  .cd div { display: flex; flex-direction: column; align-items: center; min-width: 3ch; }
  .cd b { font-weight: 600; font-size: clamp(1.7rem, 8vw, 2.7rem); line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
  .cd small { font-size: clamp(.8rem, 3.2vw, .95rem); color: #F7A8C4; opacity: .85; font-style: italic; margin-top: 4px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2713A"/><stop offset=".5" stop-color="#A2451D"/><stop offset="1" stop-color="#5E220C"/>
    </linearGradient>
    <radialGradient id="oil" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#7A4514"/><stop offset="1" stop-color="#2A1206"/>
    </radialGradient>
  </defs>
</svg>

<div id="sky"></div>
<canvas id="fx"></canvas>

<div id="intro">
  <p id="line1" class="intro-line">Close your eyes for 5 seconds</p>
  <p id="line2" class="intro-line">Endrum En Enaval – Amogaa</p>
</div>

<main id="app">
  <div id="banner">
    <canvas id="bannerCanvas" role="img" aria-label="Happy Thala Diwali en chella Pondatiii"></canvas>
  </div>
  <div id="diyaRow" class="row"></div>

  <div id="middle">
    <p id="hint" class="hint">Tap the glowing diya</p>

    <div id="rangoliWrap">
      <svg id="rangoli" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <button id="heartBtn" type="button" aria-label="Tap our photo">
        <img id="heart" src="photos/photo6.jpg" alt="Us" draggable="false">
      </button>
    </div>

    <div id="final">
      <canvas id="msgCanvas" role="img" aria-label="Happy 11th month anniversary Paapu Kutty"></canvas>

      <div id="countdown">
        <p id="cdLabel" class="cd-label">Until our first love anniversary</p>
        <div class="cd">
          <div><b id="cdD">0</b><small>days</small></div>
          <div><b id="cdH">00</b><small>hours</small></div>
          <div><b id="cdM">00</b><small>minutes</small></div>
          <div><b id="cdS">00</b><small>seconds</small></div>
        </div>
      </div>
    </div>

    <p id="heartHint" class="hint">Tap the photo</p>
  </div>

  <div id="photoRow" class="row"></div>
</main>

<div id="veil"></div>
<div id="photos"></div>

<script>
(() => {
  'use strict';

  const N = 5;
  // Countdown target: 8 December 2026, midnight on her phone's clock.
  const TARGET = new Date(2026, 11, 8, 0, 0, 0);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = s => document.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const intro = $('#intro'), line1 = $('#line1'), line2 = $('#line2');
  const sky = $('#sky'), app = $('#app');
  const diyaRow = $('#diyaRow'), photoRow = $('#photoRow'), photosLayer = $('#photos'), veil = $('#veil');
  const hint = $('#hint'), heartHint = $('#heartHint');
  const wrap = $('#rangoliWrap'), svg = $('#rangoli'), heartBtn = $('#heartBtn'), heart = $('#heart');
  const finalBox = $('#final'), countdown = $('#countdown');

  // Start loading every photo while the opening plays.
  for (let i = 1; i <= 6; i++) { const im = new Image(); im.src = `photos/photo${i}.jpg`; }

  /* ---------- Build diyas, photo slots and photos ---------- */

  let lampDots = '';
  for (let k = 0; k < 7; k++) {
    const x = 26 + k * 8;
    const u = (x - 50) / 36;
    const y = 31 + 7.5 * (1 - u * u) + 4.5;
    lampDots += `<circle cx="${x}" cy="${y.toFixed(1)}" r="1.5"/>`;
  }
  const LAMP = `<svg class="lamp" viewBox="0 0 100 56" aria-hidden="true">
    <ellipse cx="50" cy="52.5" rx="16" ry="3.2" fill="#3E1607"/>
    <ellipse cx="50" cy="18" rx="46" ry="5.4" fill="url(#oil)" stroke="#E7965A" stroke-width="1.4"/>
    <path d="M4 18 C4 38 26 50 50 50 C74 50 96 38 96 18 C80 25 20 25 4 18 Z" fill="url(#clay)"/>
    <path d="M4 18 C20 25 80 25 96 18" fill="none" stroke="#E7965A" stroke-width="1.4"/>
    <path d="M14 31 C34 41 66 41 86 31" fill="none" stroke="#F6D54A" stroke-width="1.1" opacity=".75"/>
    <g fill="#F2C46D">${lampDots}</g>
    <path d="M50 20 L50 12.5" stroke="#2A1608" stroke-width="2.2" stroke-linecap="round"/>
  </svg>`;

  const ARC = [14, 4, 0, 4, 14];
  const HOLD_TILT = [-6, 4, -3, 5, -4];
  const FINAL_TILT = [-3, 2, -2, 3, -1];
  const REVEAL_TILT = [-2, 1.5, -1.5, 2, -1];
  const diyas = [], slots = [], phs = [];

  for (let i = 0; i < N; i++) {
    const col = document.createElement('div');
    col.className = 'col';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'diya';
    b.setAttribute('aria-label', `Light diya ${i + 1}`);
    b.style.setProperty('--arc', ARC[i] + 'px');
    b.style.setProperty('--fd', rand(.75, 1.15).toFixed(2) + 's');
    b.style.setProperty('--sd', rand(2.2, 3.4).toFixed(2) + 's');
    b.style.setProperty('--dl', (-rand(0, 2)).toFixed(2) + 's');
    b.innerHTML = `<span class="glow"></span>${LAMP}<span class="ember"></span>` +
      `<span class="flame-wrap"><span class="sway"><span class="flame"><span class="core"></span></span></span></span>`;
    b.addEventListener('click', () => light(i));
    col.appendChild(b);
    diyaRow.appendChild(col);
    diyas.push(b);

    const slot = document.createElement('div');
    slot.className = 'slot';
    photoRow.appendChild(slot);
    slots.push(slot);

    const ph = document.createElement('div');
    ph.className = 'ph';
    ph.style.setProperty('--sw', rand(3.2, 4.6).toFixed(2) + 's');
    ph.innerHTML = `<div class="swing"><div class="paper"><img src="photos/photo${i + 1}.jpg" alt="Photo ${i + 1}" draggable="false"></div></div>`;
    photosLayer.appendChild(ph);
    phs.push(ph);
  }
  diyas[0].classList.add('next');

  // The glow around each lit diya breathes irregularly, like real firelight.
  setInterval(() => {
    for (const d of diyas) {
      if (d.classList.contains('live')) {
        d.querySelector('.glow').style.setProperty('--go', (0.72 + Math.random() * 0.28).toFixed(2));
      }
    }
  }, 120);

  /* ---------- Photo positioning ---------- */

  // Each polaroid takes the shape of its own photo, so nothing is cropped.
  const Ws = [], Hs = [];
  function sizeBig() {
    phs.forEach((p, i) => {
      const im = p.querySelector('img');
      const nw = im.naturalWidth || 4, nh = im.naturalHeight || 5;
      const r = nh / nw;
      im.style.aspectRatio = `${nw} / ${nh}`;
      // Frame height = photo height + 18% of the width for the paper border.
      const w = Math.round(Math.min(innerWidth * 0.86, (innerHeight * 0.62) / (0.18 + 0.92 * r), 420));
      p.style.width = w + 'px';
      Ws[i] = w;
      Hs[i] = p.offsetHeight || w * (0.18 + 0.92 * r);
    });
  }
  // Camera photos can be huge. After loading, each photo is swapped for a smaller copy
  // (when the browser allows it) and decoded ahead of time, so nothing stalls when it appears.
  function shrinkPhoto(img, max) {
    if (img.dataset.ready || !img.naturalWidth) return;
    img.dataset.ready = '1';
    const big = Math.max(img.naturalWidth, img.naturalHeight);
    if (big > max) {
      try {
        const k = max / big, c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => { if (b) img.src = URL.createObjectURL(b); }, 'image/jpeg', 0.9);
        return;
      } catch (e) { /* keep the original */ }
    }
    if (img.decode) img.decode().catch(() => {});
  }
  phs.forEach((p, i) => {
    const im = p.querySelector('img');
    const onLoad = () => {
      shrinkPhoto(im, 1400);
      sizeBig();
      phs.forEach((q, k) => { if (['start', 'hold', 'final'].includes(q.dataset.st)) apply(k, q.dataset.st); });
    };
    if (im.complete && im.naturalWidth) onLoad();
    im.addEventListener('load', onLoad);
  });

  // The centre photo keeps its own shape too, sized to sit inside the rangoli's centre plate.
  function sizeHeart() {
    const nw = heart.naturalWidth || 1, nh = heart.naturalHeight || 1;
    const r = nh / nw;
    heartBtn.style.aspectRatio = `${nw} / ${nh}`;
    heartBtn.style.width = (38 / Math.sqrt(1 + r * r)).toFixed(2) + '%';
  }
  // A small copy of the centre photo is what breaks into pieces in the blast.
  let shardSource = null;
  function onHeartLoad() {
    sizeHeart();
    shrinkPhoto(heart, 1400);
    try {
      const big = Math.max(heart.naturalWidth, heart.naturalHeight);
      const k = Math.min(1, 640 / big);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(heart.naturalWidth * k));
      c.height = Math.max(1, Math.round(heart.naturalHeight * k));
      c.getContext('2d').drawImage(heart, 0, 0, c.width, c.height);
      shardSource = c;
    } catch (e) { shardSource = null; }
  }
  if (heart.complete && heart.naturalWidth) onHeartLoad();
  heart.addEventListener('load', onHeartLoad);

  function target(i, st) {
    if (st === 'start') {
      const r = diyas[i].querySelector('.ember').getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2, s: 0.04, r: 0, o: 0 };
    }
    if (st === 'reveal') {
      return { x: innerWidth / 2, y: innerHeight * 0.54, s: 1, r: REVEAL_TILT[i], o: 1 };
    }
    const c = slots[i].getBoundingClientRect();
    const W = Ws[i], H = Hs[i];
    const s = Math.min((c.width * 0.84) / W, (c.height - 12) / H);
    if (st === 'hold') {
      const d = diyaRow.getBoundingClientRect();
      return { x: c.left + c.width / 2, y: d.bottom + (s * H) / 2 + 12, s, r: HOLD_TILT[i], o: 1 };
    }
    return { x: c.left + c.width / 2, y: c.top + c.height / 2, s, r: FINAL_TILT[i], o: 1 };
  }

  function apply(i, st, { dur = 0, delay = 0, ease = 'cubic-bezier(.22,.9,.3,1)' } = {}) {
    const p = phs[i], t = target(i, st);
    p.dataset.st = st;
    p.style.transition = dur
      ? `transform ${dur}ms ${ease} ${delay}ms, opacity ${Math.min(dur, 700)}ms ease ${delay}ms`
      : 'none';
    p.style.transform = `translate(${t.x - Ws[i] / 2}px, ${t.y - Hs[i] / 2}px) rotate(${t.r}deg) scale(${t.s})`;
    p.style.opacity = t.o;
  }

  addEventListener('resize', () => {
    sizeBig();
    phs.forEach((p, i) => { if (p.dataset.st) apply(i, p.dataset.st); });
    fx.resize();
    petals.resize();
    love.resize();
  });

  /* ---------- Sky: twinkling stars and rising lanterns ---------- */

  for (let g = 0; g < 3; g++) {
    const layer = document.createElement('div');
    layer.className = 'stars';
    const dots = [];
    for (let k = 0; k < 16; k++) {
      const x = rand(0, 100).toFixed(2), y = (Math.pow(Math.random(), 1.6) * 70).toFixed(2);
      const big = Math.random() < .15;
      dots.push(`${x}vw ${y}vh 0 ${big ? 1 : 0}px rgba(255,246,230,${(big ? rand(.7, .95) : rand(.35, .7)).toFixed(2)})`);
    }
    layer.style.boxShadow = dots.join(',');
    layer.style.setProperty('--tw', rand(3, 5.5).toFixed(2) + 's');
    layer.style.setProperty('--td', (-g * 1.4).toFixed(2) + 's');
    sky.appendChild(layer);
  }
  const LANTERNS = reduceMotion ? 3 : 6;
  for (let k = 0; k < LANTERNS; k++) {
    const near = k % 3 === 0;
    const l = document.createElement('div');
    l.className = 'lantern';
    l.style.setProperty('--x', (5 + (k / LANTERNS) * 88 + rand(-4, 4)).toFixed(1) + '%');
    l.style.setProperty('--w', (near ? rand(30, 40) : rand(16, 26)).toFixed(0) + 'px');
    l.style.setProperty('--dur', (near ? rand(22, 28) : rand(30, 42)).toFixed(1) + 's');
    l.style.setProperty('--delay', (-rand(0, 30)).toFixed(1) + 's');
    l.style.setProperty('--ls', rand(5, 8).toFixed(1) + 's');
    l.style.setProperty('--lo', (near ? .85 : rand(.45, .65)).toFixed(2));
    l.innerHTML = '<div class="lantern-sway"><div class="lantern-body"></div></div>';
    sky.appendChild(l);
  }

  /* ---------- Opening ---------- */

  async function begin() {
    // The screen stays fully blank while the fonts load (at most about 1.6 seconds).
    try {
      await Promise.race([
        Promise.all([
          document.fonts.load('italic 500 1em "Lora"'),
          document.fonts.load('600 1em "Lora"'),
          document.fonts.load('700 1em "Dancing Script"'),
          document.fonts.load('1em "Yatra One"')
        ]),
        wait(1600)
      ]);
    } catch (e) { /* fall back to system fonts */ }

    line1.classList.add('show');          // "Close your eyes for 5 seconds", 7 seconds in total
    await wait(6200);
    line1.classList.remove('show');
    await wait(800);
    line2.classList.add('show');          // "Endrum En Enaval – Amogaa", 3 seconds in total
    await wait(2400);
    line2.classList.remove('show');
    await wait(600);

    intro.classList.add('gone');
    sky.classList.add('on');
    app.classList.add('on');
    sizeBig();
    phs.forEach((p, i) => apply(i, 'start'));
    await wait(1200);
    hint.classList.add('show');
  }

  /* ---------- Diyas and photos ---------- */

  const state = { next: 0, busy: false, phase: 'diyas' };

  function light(i) {
    if (state.phase !== 'diyas' || state.busy) return;
    if (i !== state.next) {
      const d = diyas[state.next];
      d.classList.remove('nudge'); void d.offsetWidth; d.classList.add('nudge');
      return;
    }
    state.busy = true;
    const d = diyas[i];
    d.classList.remove('next');
    d.classList.add('lit');
    setTimeout(() => d.classList.add('live'), 950);
    hint.classList.remove('show');

    reveal(i).then(() => {
      state.next++;
      state.busy = false;
      if (state.next < N) diyas[state.next].classList.add('next');
      else allLit();
    });
  }

  function waitOrTap(ms, minMs) {
    return new Promise(res => {
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        veil.removeEventListener('pointerdown', onTap);
        res();
      };
      const onTap = () => { if (performance.now() - t0 > minMs) finish(); };
      const timer = setTimeout(finish, ms);
      veil.addEventListener('pointerdown', onTap);
    });
  }

  async function reveal(i) {
    apply(i, 'start');
    void phs[i].offsetWidth;
    await wait(380);
    veil.classList.add('on');
    apply(i, 'reveal', { dur: 1100 });
    await waitOrTap(1100 + 2600, 900);   // she can tap to move on a little sooner
    veil.classList.remove('on');
    apply(i, 'hold', { dur: 1000 });
    await wait(950);
  }

  async function allLit() {
    state.phase = 'drift';
    await wait(500);
    const dur = 2600, step = 160;
    for (let i = 0; i < N; i++) {
      apply(i, 'final', { dur, delay: i * step, ease: 'cubic-bezier(.45,.05,.3,1)' });
      setTimeout(() => phs[i].classList.add('swinging'), dur * 0.6 + i * step);
    }
    // While the photos drift down, marigold petals fall and form the Diwali wish at the top.
    buildRangoli();
    petals.start();
    fx.warm();
    // The rangoli begins while the last petals are still settling, so the steps flow into each other.
    await wait(4600);
    runRangoli();
  }

  /* ---------- Rangoli ---------- */

  let rangoliParts = null;
  function buildRangoli() {
    const NS = 'http://www.w3.org/2000/svg';
    const C = 200;
    const DEG = Math.PI / 180;
    const K = reduceMotion ? 0.6 : 0.85;   // overall speed of the drawing
    const lines = [], dots = [];

    const mk = (tag, attrs) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      svg.appendChild(e);
      return e;
    };
    const at = (r, a) => [C + r * Math.cos(a), C + r * Math.sin(a)];
    const petal = (r1, r2, w, a) => {
      const L = r2 - r1, c = Math.cos(a), s = Math.sin(a);
      const P = (x, y) => `${(C + x * c - y * s).toFixed(2)} ${(C + x * s + y * c).toFixed(2)}`;
      return `M${P(r1, 0)} C${P(r1 + L * .35, -w * 1.35)} ${P(r2, -w * .95)} ${P(r2, 0)} ` +
             `C${P(r2, w * .95)} ${P(r1 + L * .35, w * 1.35)} ${P(r1, 0)}Z`;
    };
    const addLine = (d, fill, delay, dur, fillDelay) => {
      const p = mk('path', { d, class: 'r-line', fill: fill || 'none' });
      lines.push({ p, fill: !!fill, delay: delay * K, dur: dur * K, fillDelay: fillDelay * K });
    };
    const addDot = (r, a) => {
      const [x, y] = at(r, a);
      dots.push(mk('circle', { cx: x.toFixed(2), cy: y.toFixed(2), r: 2.6, class: 'r-dot' }));
    };

    // Kolam dots appear first, as guides.
    for (let k = 0; k < 16; k++) addDot(186, (k * 22.5 + 11.25 - 90) * DEG);
    for (let k = 0; k < 8; k++) addDot(140, (k * 45 + 22.5 - 90) * DEG);
    for (let k = 0; k < 16; k++) addDot(80, (k * 22.5 + 11.25 - 90) * DEG);

    // Centre plate, where the photo sits.
    addLine(`M${C - 72} ${C} a72 72 0 1 0 144 0 a72 72 0 1 0 -144 0`, '#2B0F35', 1300, 900, 7000);

    // Eight large petals.
    for (let k = 0; k < 8; k++) {
      const a = (k * 45 - 90) * DEG;
      addLine(petal(82, 150, 24, a), k % 2 ? '#F08A24' : '#C4123A', 2100 + k * 130, 600, 7200 + k * 70);
    }
    // A turmeric vein inside each large petal.
    for (let k = 0; k < 8; k++) {
      const a = (k * 45 - 90) * DEG;
      addLine(petal(94, 138, 10, a), '#F6D54A', 3300 + k * 80, 400, 7700 + k * 50);
    }
    // Eight small petals between them.
    for (let k = 0; k < 8; k++) {
      const a = (k * 45 + 22.5 - 90) * DEG;
      addLine(petal(84, 124, 14, a), '#E0559A', 4000 + k * 100, 450, 8000 + k * 50);
    }
    // Scalloped ring around the flower.
    let wave = '';
    for (let s = 0; s <= 720; s++) {
      const th = (s / 720) * Math.PI * 2;
      const [x, y] = at(158 + 9 * Math.cos(16 * (th + Math.PI / 2)), th);
      wave += (s ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
    }
    addLine(wave + 'Z', null, 4900, 1500, 0);
    // Sixteen outer leaves.
    for (let k = 0; k < 16; k++) {
      const a = (k * 22.5 - 90) * DEG;
      addLine(petal(170, 197, 9, a), k % 2 ? '#F6D54A' : '#2E9E5B', 6200 + k * 50, 400, 8300 + k * 30);
    }

    for (const L of lines) {
      const len = L.p.getTotalLength();
      L.p.style.strokeDasharray = len;
      L.p.style.strokeDashoffset = len;
    }
    rangoliParts = { lines, dots, K };
  }

  async function runRangoli() {
    state.phase = 'rangoli';
    const { lines, dots, K } = rangoliParts;
    wrap.classList.add('on');
    await nextFrame();

    dots.forEach((d, i) => {
      d.style.transition = `opacity .5s ease ${Math.round(i * 35 * K)}ms`;
      d.style.opacity = 1;
    });
    for (const L of lines) {
      L.p.style.transition =
        `stroke-dashoffset ${L.dur}ms ease-in-out ${L.delay}ms, fill-opacity 700ms ease ${L.fillDelay}ms`;
      L.p.style.strokeDashoffset = 0;
      if (L.fill) L.p.style.fillOpacity = 0.92;
    }

    await wait(9600 * K);
    heartBtn.classList.add('on');
    await wait(1100);
    heartBtn.classList.add('pulse');
    heartHint.classList.add('show');
    state.phase = 'heart';
  }

  heartBtn.addEventListener('click', async () => {

    wrap.classList.add('sweep');
    await wait(900);
    fx.startShow();
    await wait(700);

  });

      for (const c of [ctx, offCtx]) { c.lineCap = 'round'; c.lineJoin = 'round'; }
      grad = ctx.createLinearGradient(0, 0, cssW, 0);
      grad.addColorStop(0, '#FFE3EC'); grad.addColorStop(.35, '#FF9EBB');
      grad.addColorStop(.65, '#FFD1DC'); grad.addColorStop(1, '#F7A8C4');
    }
    const px = p => [(p[0] - L.vb[0]) * scale, (p[1] - L.vb[1]) * scale];

    function build(fromScreen) {
      fit();
      const [vx, vy, vw, vh] = L.vb;
      // Lead-in from the burst spot: one small loop, then a sweep round to the first letter.
      const first = L.segs[0].pts[0];
      let sx = vx + vw / 2, sy = vy + vh;
      if (fromScreen) {
        const r = cv.getBoundingClientRect();
        sx = vx + (fromScreen.x - r.left) / scale;
        sy = vy + (fromScreen.y - r.top) / scale;
      }
      sx = Math.max(vx + 20, Math.min(vx + vw - 20, sx));
      sy = Math.max(vy + 20, Math.min(vy + vh - 6, sy));
      const lead = [];
      const R = 14;
      for (let k = 0; k <= 40; k++) {
        const a = Math.PI / 2 + (k / 40) * Math.PI * 2;
        lead.push([sx + R * Math.cos(a), sy - R + R * Math.sin(a)]);
      }
      const p0 = lead[lead.length - 1];
      const c1 = [vx + 6, p0[1] + 6], c2 = [vx + 4, first[1] + 40];
      for (let k = 1; k <= 36; k++) {
        const t = k / 36, u = 1 - t;
        lead.push([
          u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*first[0],
          u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*first[1]
        ]);
      }
      const segs = [{ k: 't', pts: lead }].concat(L.segs);
      let total = 0;
      items = segs.map(sg => {
        const pts = sg.pts.map(px);
        const cum = [0];
        let len = 0;
        for (let i = 1; i < pts.length; i++) {
          len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
          cum.push(len);
        }
        const dur = len / (sg.k === 'i' ? 1 : 1.8);
        const it = { k: sg.k, pts, cum, len, t0: total, dur };
        total += dur;
        return it;
      });
      baked = 1;          // item 0 (the lead-in) is never baked: it fades away separately
      finished = false;
      return total;
    }

    function stroke(c, it, upto) {
      const { pts, cum } = it;
      if (pts.length < 2 || upto <= 0) return;
      c.beginPath();
      c.moveTo(pts[0][0], pts[0][1]);
      let i = 1;
      for (; i < pts.length && cum[i] <= upto; i++) c.lineTo(pts[i][0], pts[i][1]);
      if (i < pts.length && upto < it.len) {
        const f = (upto - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
        c.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f);
      }
      if (it.k === 'i') {
        c.lineWidth = narrow ? 10 : 9; c.strokeStyle = 'rgba(255,110,165,.10)'; c.stroke();
        c.lineWidth = narrow ? 5.5 : 5; c.strokeStyle = 'rgba(255,140,185,.22)'; c.stroke();
        c.lineWidth = narrow ? 2.8 : 2.4; c.strokeStyle = grad; c.stroke();
      } else {
        c.lineWidth = 3; c.strokeStyle = 'rgba(255,140,185,.08)'; c.stroke();
        c.lineWidth = 1.1; c.strokeStyle = 'rgba(255,205,222,.5)'; c.stroke();
      }
    }
    function pointAt(it, d) {
      const { pts, cum } = it;
      let i = 1;
      while (i < pts.length - 1 && cum[i] < d) i++;
      const f = Math.max(0, Math.min(1, (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1)));
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
    }
    function heartSpark(x, y, a) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 15);
      g.addColorStop(0, `rgba(255,240,246,${.95 * a})`);
      g.addColorStop(.4, `rgba(255,150,190,${.55 * a})`);
      g.addColorStop(1, 'rgba(255,110,165,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - 15, y - 15, 30, 30);
      const s = 4.2;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#FFF4F8';
      ctx.beginPath();
      ctx.moveTo(x, y + s * .9);
      ctx.bezierCurveTo(x - s * 1.6, y - s * .1, x - s * .7, y - s * 1.3, x, y - s * .45);
      ctx.bezierCurveTo(x + s * .7, y - s * 1.3, x + s * 1.6, y - s * .1, x, y + s * .9);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function write(fromScreen, DUR) {
      cv.classList.remove('done');
      const total = build(fromScreen);
      return new Promise(res => {
        const t0 = performance.now();
        let leadGoneAt = 0, doneAt = 0, resolved = false;
        const step = now => {
          const f = Math.min(1, (now - t0) / DUR);
          const T = f * total;
          // Bake every segment that has finished into the "done" canvas, once.
          while (baked < items.length && T >= items[baked].t0 + items[baked].dur) {
            stroke(offCtx, items[baked], items[baked].len);
            baked++;
          }
          ctx.clearRect(0, 0, cssW, cssH);
          // Lead-in, fading out once writing has begun.
          const lead = items[0];
          let leadA = 1;
          if (T >= lead.dur) {
            if (!leadGoneAt) leadGoneAt = now;
            leadA = Math.max(0, 1 - (now - leadGoneAt) / 1600);
          }
          if (leadA > 0) {
            ctx.globalAlpha = leadA;
            stroke(ctx, lead, Math.min(lead.len, (T / lead.dur) * lead.len));
            ctx.globalAlpha = 1;
          }
          ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(off, 0, 0); ctx.restore();
          // The segment being written right now, and the heart-shaped spark at its tip.
          let tip = null;
          const cur = baked < items.length ? items[baked] : null;
          if (T < lead.dur) {
            tip = pointAt(lead, (T / lead.dur) * lead.len);
          } else if (cur) {
            const d = ((T - cur.t0) / cur.dur) * cur.len;
            stroke(ctx, cur, d);
            tip = pointAt(cur, d);
          }
          let sparkA = 1;
          if (f >= 1) {
            if (!doneAt) doneAt = now;
            sparkA = Math.max(0, 1 - (now - doneAt) / 600);
            const last = items[items.length - 1];
            tip = last.pts[last.pts.length - 1];
            if (!resolved) { resolved = true; finished = true; cv.classList.add('done'); res(); }
          }
          if (tip && sparkA > 0) {
            heartSpark(tip[0], tip[1], sparkA);
            if (f < 1) {
              const r = cv.getBoundingClientRect();
              fx.sparkle(r.left + tip[0], r.top + tip[1], ['#FFB3CF', '#FF7FAF', '#FFE3EC']);
            }
          }

        };
        requestAnimationFrame(step);
      });
    }

    // Redraw the finished message after a resize or rotation.
    function resize() {
      if (!finished) return;
      fit();
      const keep = items;
      build(null);
      for (let i = 1; i < items.length; i++) stroke(ctx, items[i], items[i].len);
      void keep;
    }

    return { write, resize };
  })();

  const cdD = $('#cdD'), cdH = $('#cdH'), cdM = $('#cdM'), cdS = $('#cdS'), cdLabel = $('#cdLabel');
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    let diff = TARGET - Date.now();
    if (diff <= 0) {
      diff = 0;
      cdLabel.textContent = 'Happy first love anniversary';
    }
    const s = Math.floor(diff / 1000);
    cdD.textContent = Math.floor(s / 86400);
    cdH.textContent = pad(Math.floor((s % 86400) / 3600));
    cdM.textContent = pad(Math.floor((s % 3600) / 60));
    cdS.textContent = pad(s % 60);
  }

  const slow = reduceMotion ? 0.65 : 1;

  /* ---------- Diwali banner: marigold petals settle into the words ---------- */

  const petals = (() => {
    const cv = $('#bannerCanvas'), ctx = cv.getContext('2d');
    const COLORS = ['#FF9F1C', '#FFB703', '#FB8500', '#FFC43D', '#F77F00', '#FFD166', '#E85D04'];
    const ACCENTS = ['#D62828', '#C1121F'];
    let W = 0, H = 0, dpr = 1, list = [], glow = null, started = false, done = false, t0 = 0, endAt = 0;

    function drawHeart(c, x, y, s) {
      c.beginPath();
      c.moveTo(x, y + s * .9);
      c.bezierCurveTo(x - s * 1.6, y - s * .1, x - s * .7, y - s * 1.3, x, y - s * .45);
      c.bezierCurveTo(x + s * .7, y - s * 1.3, x + s * 1.6, y - s * .1, x, y + s * .9);
      c.fill();
    }

    // Draws the two lines of the wish (and a heart) in white on a canvas, for sampling and for the glow.
    function paintText(c) {
      const family = '"Yatra One", "Rozha One", Georgia, serif';
      const l1 = 'Happy Thala Diwali', l2 = 'en chella Pondatiii';
      let fs = H / 2.45;
      c.font = `${fs}px ${family}`;
      const heartS = () => fs * 0.34;
      const width2 = () => c.measureText(l2).width + fs * 0.25 + heartS() * 3.2;
      const fitK = Math.min(1, (W * 0.94) / Math.max(c.measureText(l1).width, width2()));
      fs *= fitK;
      c.font = `${fs}px ${family}`;
      c.textBaseline = 'alphabetic';
      const y1 = (H - fs * 2.2) / 2 + fs * 0.92, y2 = y1 + fs * 1.16;
      c.textAlign = 'center';
      c.fillText(l1, W / 2, y1);
      const w2 = width2();
      const x2 = (W - w2) / 2;
      c.textAlign = 'left';
      c.fillText(l2, x2, y2);
      drawHeart(c, x2 + c.measureText(l2).width + fs * 0.25 + heartS() * 1.6, y2 - fs * 0.3, heartS());
      return fs;
    }

    function layout() {
      W = cv.clientWidth; H = cv.clientHeight;
      if (!W || !H) return false;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Sample the letter shapes at CSS-pixel resolution.
      const m = document.createElement('canvas');
      m.width = Math.ceil(W); m.height = Math.ceil(H);
      const mc = m.getContext('2d');
      mc.fillStyle = '#fff';
      const fs = paintText(mc);
      const data = mc.getImageData(0, 0, m.width, m.height).data;
      let stepPx = Math.max(2.2, fs / 15);
      const pts = [];
      for (let tries = 0; tries < 3; tries++) {
        pts.length = 0;
        for (let y = 0; y < m.height; y += stepPx) {
          for (let x = 0; x < m.width; x += stepPx) {
            const jx = x + (Math.random() - .5) * stepPx * .5, jy = y + (Math.random() - .5) * stepPx * .5;
            const ix = Math.min(m.width - 1, Math.max(0, jx | 0)), iy = Math.min(m.height - 1, Math.max(0, jy | 0));
            if (data[(iy * m.width + ix) * 4 + 3] > 140) pts.push([jx, jy]);
          }
        }
        if (pts.length <= 2600) break;
        stepPx *= 1.15;
      }

      // A soft golden glow of the words, drawn once, fades in behind the petals as they settle.
      glow = document.createElement('canvas');
      glow.width = cv.width; glow.height = cv.height;
      const gc = glow.getContext('2d');
      gc.setTransform(dpr, 0, 0, dpr, 0, 0);
      gc.shadowColor = 'rgba(255,170,60,.85)';
      gc.shadowBlur = 14;
      gc.fillStyle = 'rgba(255,200,110,.32)';
      paintText(gc);

      list = pts.map(([tx, ty]) => {
        const delay = (tx / W) * 2.6 + Math.random() * 0.8;
        return {
          tx, ty,
          sx: tx + rand(-70, 70), sy: -rand(20, 140),
          delay, dur: rand(1.3, 2.1),
          r0: rand(0, Math.PI * 2), r1: rand(-.8, .8), spin: rand(2, 5) * (Math.random() < .5 ? -1 : 1),
          ph: rand(0, 6.28),
          size: stepPx * rand(.85, 1.25),
          color: Math.random() < .07 ? pick(ACCENTS) : pick(COLORS)
        };
      });
      endAt = Math.max(...list.map(p => p.delay + p.dur), 1);
      return true;
    }

    function render(time) {
      const byColor = new Map();
      for (const p of list) {
        const t = time - p.delay;
        if (t <= 0) continue;
        const f = Math.min(1, t / p.dur);
        const e = 1 - Math.pow(1 - f, 3);
        const sway = Math.sin(t * 4 + p.ph) * 12 * (1 - e);
        const x = p.sx + (p.tx - p.sx) * e + sway;
        const y = p.sy + (p.ty - p.sy) * e;
        const rot = p.r0 + (p.r1 - p.r0) * e + (1 - e) * t * p.spin;
        let path = byColor.get(p.color);
        if (!path) { path = new Path2D(); byColor.set(p.color, path); }
        path.moveTo(x + p.size * .95 * Math.cos(rot), y + p.size * .95 * Math.sin(rot));
        path.ellipse(x, y, p.size * .95, p.size * .55, rot, 0, Math.PI * 2);
      }
      ctx.clearRect(0, 0, W, H);
      const ga = Math.max(0, Math.min(1, (time - (endAt - 1.6)) / 1.6));
      if (ga > 0 && glow) {
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = ga; ctx.drawImage(glow, 0, 0);
        ctx.restore();
      }
      for (const [color, path] of byColor) { ctx.fillStyle = color; ctx.fill(path); }
    }

    function frame(now) {
      const time = (now - t0) / 1000;
      render(time);
      if (time < endAt + 0.1) requestAnimationFrame(frame);
      else { done = true; render(endAt + 1); }
    }

    function start() {
      if (started) return;
      started = true;
      if (!layout()) return;
      t0 = performance.now();
      requestAnimationFrame(frame);
    }

    // After a resize or rotation, the settled wish is laid out again at the new size.
    function resize() {
      if (!done) return;
      if (layout()) render(endAt + 1);
    }

    return { start, resize };
  })();

  // After the photo bursts: the anniversary wish in the middle, kept on screen with the countdown.
  async function showFinal(fromScreen) {
    finalBox.classList.add('on');
    await nextFrame();
    await love.write(fromScreen, 8500 * slow);
    tick();
    setInterval(tick, 1000);
    countdown.classList.add('on');
  }

  /* ---------- Fireworks ---------- */

  const fx = (() => {
    const cv = $('#fx'), ctx = cv.getContext('2d');
    const COLORS = ['#FFD36B', '#FF9A3C', '#FF4D6D', '#FFE9B0', '#FF6FB5', '#8EE6A8', '#C59BFF', '#7FD8FF', '#FFC94D'];
    let w = 0, h = 0, sk = 1, running = false, show = false, last = 0, nextLaunch = 0;
    let parts = [], rockets = [], pieces = [], flashes = [];
    let shardImg = null;

    function resize() {
      const dpr = Math.min(1.5, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      sk = Math.max(0.75, Math.min(1.6, Math.min(w, h) / 480));
    }
    resize();

    function spark(x, y, vx, vy, color, o = {}) {
      if (parts.length > 1400) return;
      parts.push({
        x, y, px: x, py: y, vx, vy, color, life: 1,
        decay: o.decay || rand(.011, .018), drag: o.drag || .955,
        g: o.g === undefined ? .035 : o.g, size: o.size || rand(1.2, 2.2),
        twinkle: !!o.twinkle, crackle: !!o.crackle, cr: false
      });
    }

    function burst(x, y, opt = {}) {
      const scale = opt.scale || 1;
      const type = opt.type || pick(['peony', 'peony', 'ring', 'willow', 'heart', 'peony', 'crackle']);
      const c1 = opt.color || pick(COLORS), c2 = Math.random() < .45 ? pick(COLORS) : c1;
      if (!opt.noFlash) flashes.push({ x, y, r: 40 * scale * sk, life: 1 });

      if (type === 'heart') {
        const n = Math.round(64 * scale), sp = .23 * sk * scale, col = pick(['#FF4D6D', '#FF6FB5', '#FFD36B']);
        for (let k = 0; k < n; k++) {
          const t = (k / n) * Math.PI * 2;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          spark(x, y, hx * sp, hy * sp, col, { decay: rand(.010, .013), drag: .95, g: .012, size: 2 });
        }
        return;
      }

        const n = Math.round(50 * scale), sp = 3.3 * sk * scale, rot = Math.random() * Math.PI, tilt = rand(.45, 1);
        for (let k = 0; k < n; k++) {
          const a = (k / n) * Math.PI * 2;
          const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp * tilt;

        }

    function launch() {
      const x = rand(w * .1, w * .9), ty = rand(h * .1, h * .42), y = h + 10, g = .05;

    }

    function shatter(img, rect) {
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      const R = Math.max(rect.width, rect.height) / 2;
      // About 36 pieces whatever the photo's shape.
      const cols = Math.max(3, Math.round(Math.sqrt(36 * rect.width / rect.height)));
      const rows = Math.max(3, Math.round(36 / cols));
      const tw = rect.width / cols, th = rect.height / rows;

      const nw = shardImg ? img.width : 0, nh = shardImg ? img.height : 0;
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          const px = rect.left + (i + .5) * tw, py = rect.top + (j + .5) * th;
          const dx = px - cx, dy = py - cy;
          const dist = Math.hypot(dx, dy) || 1;
          pieces.push({
            sx: (i * nw) / cols, sy: (j * nh) / rows, sw: nw / cols, sh: nh / rows,
            x: px, y: py, w: tw, h: th,
            vx: (dx / dist) * rand(1, 4) * sk + rand(-.6, .6),
            vy: -rand(7, 12) * Math.sqrt(sk) + (dy / dist) * rand(0, 2),
            rot: 0, vr: rand(-.15, .15), fuse: rand(35, 70)
          });

      }

    let idleCleared = false;
    function frame(t) {
      if (!last) last = t;
      const dt = Math.min(3, (t - last) / 16.667);

      // Nothing to draw yet: keep the loop warm without doing any work.

      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.vy += r.g * dt; r.x += r.vx * dt; r.y += r.vy * dt;

        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= p.decay * dt;
        if (p.crackle && !p.cr && p.life < .4) {
          p.cr = true;
          for (let k = 0; k < 3; k++) spark(p.x, p.y, rand(-1, 1), rand(-1, 1), '#FFFFFF', { decay: .08, size: 1.4, g: 0 });
        }
        if (p.life <= 0 || p.y > h + 40) continue;
        if (!(p.twinkle && p.life < .5 && Math.random() < .35)) {
          const a = Math.min(4, (Math.min(1, p.life * 1.4) * 5) | 0);
          const wl = p.size > 1.7 ? 1 : 0;
          const key = p.color + a + wl;
          let b = buckets.get(key);
          if (!b) { b = { path: new Path2D(), color: p.color, alpha: (a + 1) / 5, width: wl ? 2.1 : 1.3 }; buckets.set(key, b); }
          b.path.moveTo(p.px, p.py);
          b.path.lineTo(p.x, p.y);
        }
        parts[j++] = p;
      }
      parts.length = j;
      for (const b of buckets.values()) {
        ctx.globalAlpha = b.alpha;
        ctx.strokeStyle = b.color;
        ctx.lineWidth = b.width;
        ctx.stroke(b.path);
      }

      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i];
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        g.addColorStop(0, `rgba(255,240,200,${.5 * f.life})`);
        g.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
        f.life -= .08 * dt;
        if (f.life <= 0) flashes.splice(i, 1);
      }

      ctx.globalCompositeOperation = 'source-over';
      for (let i = pieces.length - 1; i >= 0; i--) {
        const pc = pieces[i];
        pc.vy += .16 * dt; pc.vx *= .995;
        pc.x += pc.vx * dt; pc.y += pc.vy * dt;
        pc.rot += pc.vr * dt; pc.fuse -= dt;
        if (pc.fuse <= 0) {
          pieces.splice(i, 1);
          ctx.globalCompositeOperation = 'lighter';
          burst(pc.x, pc.y, { scale: rand(.35, .6), type: pick(['peony', 'peony', 'ring', 'heart']), noFlash: Math.random() < .7 });
          ctx.globalCompositeOperation = 'source-over';
          continue;
        }
        if (shardImg) {
          ctx.save();
          ctx.globalAlpha = 1;
          ctx.translate(pc.x, pc.y);
          ctx.rotate(pc.rot);
          ctx.drawImage(shardImg, pc.sx, pc.sy, pc.sw, pc.sh, -pc.w / 2, -pc.h / 2, pc.w, pc.h);
          ctx.restore();
        }
      }

      requestAnimationFrame(frame);
    }

    function ensure() {
      if (!running) { running = true; requestAnimationFrame(frame); }
    }

    function sparkle(x, y, colors) {
      ensure();
      for (let k = 0; k < 2; k++) {
        spark(x, y, rand(-1.2, 1.2), rand(-1.4, .6), colors ? pick(colors) : (Math.random() < .5 ? '#FFE9B0' : '#FFC94D'),
          { decay: rand(.03, .05), drag: .94, g: .04, size: rand(.8, 1.6) });
      }
    }

    return {
      resize,
      shatter,
      sparkle,
      warm: ensure,
      startShow() { show = true; nextLaunch = 0; ensure(); }
    };
  })();

  begin();
})();
</script>
</body>
</html>
